name: CiteBase CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run PyTest Test Suite
        env:
          ENV: development
          AUTH_ENABLED: true
          DATABASE_URL: sqlite:///./data/ci_test.db
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ci_mock_gemini_api_key
          BOOTSTRAP_API_KEY: sk_test_ci_master_key_99999
        run: |
          pytest tests/ -v --durations=10

      - name: Verify Cache Benchmark Reproducibility
        env:
          ENV: development
          AUTH_ENABLED: true
          DATABASE_URL: sqlite:///./data/ci_test.db
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ci_mock_gemini_api_key
          BOOTSTRAP_API_KEY: sk_test_ci_master_key_99999
        run: |
          python scripts/benchmark_cache.py --iterations 3

      - name: Verify Production Fail-Closed Startup Guard
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'backend')
          os.environ['ENV'] = 'production'
          os.environ['BOOTSTRAP_API_KEY'] = 'your_bootstrap_api_key_here'
          try:
              import config
              print('FAILED: Should have thrown EnvironmentError!')
              sys.exit(1)
          except EnvironmentError as e:
              print(f'SUCCESS: Fail-closed guard triggered properly: {e}')
          "
